<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center p-6"
  >
    <div
      class="w-full max-w-3xl bg-white/10 border border-white/20 rounded-3xl shadow-2xl p-8"
    >
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">Student Registration</h1>

        <p class="text-slate-300">
          Fill student details for ID card generation
        </p>
      </div>

      {% if success %}

      <div
        id="successMessage"
        class="fixed top-5 right-5 bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl transition-all duration-500"
      >
        Student data saved successfully.
      </div>

      {% endif %}

      <form
        id="studentForm"
        method="POST"
        enctype="multipart/form-data"
        class="grid grid-cols-1 md:grid-cols-2 gap-5"
      >
        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Student Name
          </label>

          <input
            type="text"
            name="student_name"
            placeholder="Enter student name"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Class
          </label>

          <input
            type="text"
            name="class"
            placeholder="Enter class"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Section
          </label>

          <input
            type="text"
            name="section"
            placeholder="Enter section"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Date of Birth
          </label>

          <input
            type="text"
            name="dob"
            placeholder="DD-MM-YYYY"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Father Name
          </label>

          <input
            type="text"
            name="father_name"
            placeholder="Enter father name"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Mother Name
          </label>

          <input
            type="text"
            name="mother_name"
            placeholder="Enter mother name"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Mobile Number
          </label>

          <input
            type="tel"
            name="mobile"
            placeholder="Enter mobile number"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Upload Photo
          </label>

          <input
            type="file"
            name="photo"
            accept="image/*"
            capture="environment"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white outline-none file:mr-4 file:px-4 file:py-2 file:border-0 file:rounded-lg file:bg-blue-600 file:text-white hover:file:bg-blue-700"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Street
          </label>

          <input
            type="text"
            name="street"
            placeholder="Enter street address"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            State
          </label>

          <input
            type="text"
            id="state"
            list="states"
            name="state"
            placeholder="Select State"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
          <datalist id="states"></datalist>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            City
          </label>

          <input
            type="text"
            id="city"
            list="cities"
            name="city"
            placeholder="Select city"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
          <datalist id="cities"></datalist>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Pincode
          </label>

          <input
            type="text"
            name="pincode"
            placeholder="Enter Pincode"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div class="md:col-span-2 mt-2">
          <button
            id="submitBtn"
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 transition-all duration-300 text-white font-semibold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2"
          >
            <span id="btnText"> Submit Student Data </span>

            <span
              id="loader"
              class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
            ></span>
          </button>
        </div>
      </form>
    </div>

    <script>
      const successMessage = document.getElementById("successMessage");

      if (successMessage) {
        setTimeout(() => {
          successMessage.style.opacity = "0";
        }, 3000);
      }

      const form = document.getElementById("studentForm");

      if (form && successMessage) {
        form.reset();
      }

      form.addEventListener("submit", () => {
        document.getElementById("btnText").innerText = "Submitting...";

        document.getElementById("loader").classList.remove("hidden");
      });

      const stateInput = document.getElementById("state");

      const stateList = document.getElementById("states");

      const cityList = document.getElementById("cities");

      // LOAD STATES

      fetch("https://countriesnow.space/api/v0.1/countries/states", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
        },

        body: JSON.stringify({
          country: "India",
        }),
      })
        .then((response) => response.json())

        .then((data) => {
          const states = data.data.states;

          states.forEach((state) => {
            const option = document.createElement("option");

            option.value = state.name;

            stateList.appendChild(option);
          });
        });

      // LOAD CITIES WHEN STATE CHANGES

      stateInput.addEventListener("change", () => {
        cityList.innerHTML = "";

        fetch("https://countriesnow.space/api/v0.1/countries/state/cities", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            country: "India",

            state: stateInput.value,
          }),
        })
          .then((response) => response.json())

          .then((data) => {
            data.data.forEach((city) => {
              const option = document.createElement("option");

              option.value = city.normalize("NFKD");

              cityList.appendChild(option);
            });
          });
      });
    </script>
  </body>
</html>
